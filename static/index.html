<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>冷旭帆</title>
  <link rel="manifest" href="/manifest.json">
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #21262d;
      --text: #c9d1d9;
      --text-secondary: #8b949e;
      --primary: #238636;
      --primary-hover: #2ea043;
      --danger: #f85149;
      --accent: #58a6ff;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: -apple-system, "Microsoft YaHei", sans-serif;
      background: var(--bg); color: var(--text);
      height: 100vh; display: flex; flex-direction: column;
      overflow: hidden;
    }
    /* ---- Login Screen ---- */
    #login-screen {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; height: 100%; padding: 20px;
      background: var(--bg);
    }
    #login-screen h1 { color: var(--accent); margin-bottom: 20px; font-size: 28px; }
    #login-screen .form-group { width: 100%; max-width: 320px; margin-bottom: 12px; }
    #login-screen input {
      width: 100%; padding: 12px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--surface);
      color: var(--text); font-size: 16px; outline: none;
    }
    #login-screen input:focus { border-color: var(--accent); }
    #login-screen button {
      width: 100%; padding: 12px; border-radius: 8px; border: none;
      font-size: 16px; cursor: pointer; margin-bottom: 8px;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:active { background: var(--primary-hover); }
    .btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
    #login-screen .guest-link {
      color: var(--text-secondary); margin-top: 12px; cursor: pointer;
      text-decoration: underline; font-size: 14px;
    }
    /* ---- Chat Screen ---- */
    #chat-screen {
      display: none; flex-direction: column; height: 100%;
    }
    #header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border);
    }
    #header .title { display: flex; align-items: center; gap: 8px; }
    #header .dot { width: 8px; height: 8px; background: #3fb950; border-radius: 50%; }
    #header .actions { display: flex; gap: 8px; }
    .icon-btn {
      background: none; border: none; color: var(--text-secondary);
      font-size: 20px; cursor: pointer; padding: 4px;
    }
    #messages {
      flex: 1; overflow-y: auto; padding: 16px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .message {
      max-width: 85%; padding: 10px 14px; border-radius: 12px;
      font-size: 15px; line-height: 1.5; white-space: pre-wrap;
      word-break: break-word; position: relative;
    }
    .message.user {
      align-self: flex-end; background: var(--primary); color: white;
    }
    .message.lxf {
      align-self: flex-start; background: var(--surface); border: 1px solid var(--border);
    }
    .message .monologue {
      color: var(--text-secondary); font-style: italic;
      margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--border);
      font-size: 13px;
    }
    .message .annotation-badge {
      position: absolute; top: -6px; right: -6px;
      background: var(--accent); color: white; border-radius: 50%;
      width: 16px; height: 16px; font-size: 10px; text-align: center;
      line-height: 16px; display: none;
    }
    .message .dev-info {
      display: none; margin-top: 8px; padding-top: 8px;
      border-top: 1px solid var(--border); font-size: 11px;
      color: var(--text-secondary); white-space: pre-wrap;
    }
    #input-area {
      display: flex; padding: 10px 12px; background: var(--surface);
      border-top: 1px solid var(--border); gap: 8px;
    }
    #msg-input {
      flex: 1; padding: 10px 14px; border-radius: 20px;
      border: 1px solid var(--border); background: var(--bg);
      color: var(--text); font-size: 15px; outline: none;
    }
    #msg-input:focus { border-color: var(--accent); }
    #send-btn {
      width: 44px; height: 44px; border-radius: 50%;
      background: var(--primary); border: none; color: white;
      font-size: 18px; cursor: pointer;
    }
    #send-btn:active { background: var(--primary-hover); }
    /* ---- Dev Panel ---- */
    #dev-panel {
      display: none; background: var(--surface); border-top: 1px solid var(--border);
      max-height: 40vh; overflow-y: auto; padding: 12px; font-size: 13px;
    }
    .dev-section { margin-bottom: 10px; }
    .dev-section h4 { color: var(--accent); margin-bottom: 4px; font-size: 13px; }
    .dev-value { color: var(--text); }
    .dev-delta { font-size: 12px; }
    .dev-up { color: #3fb950; }
    .dev-down { color: var(--danger); }
    /* ---- Annotation Modal ---- */
    #annotation-modal {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7); z-index: 10;
      justify-content: center; align-items: center;
    }
    #annotation-modal .modal-content {
      background: var(--surface); border-radius: 12px; padding: 20px;
      width: 90%; max-width: 400px;
    }
    #annotation-modal textarea {
      width: 100%; height: 100px; padding: 10px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--bg);
      color: var(--text); font-size: 14px; resize: vertical; outline: none;
    }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
    /* ---- Export Preview Modal ---- */
    #export-modal {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7); z-index: 10;
      flex-direction: column; justify-content: center; align-items: center;
    }
    #export-modal .modal-content {
      background: var(--surface); border-radius: 12px; padding: 20px;
      width: 90%; max-width: 500px; max-height: 80vh;
      display: flex; flex-direction: column;
    }
    #export-preview {
      flex: 1; overflow-y: auto; white-space: pre-wrap;
      font-size: 13px; padding: 10px; background: var(--bg);
      border-radius: 8px; margin-bottom: 12px;
    }
    .export-options { display: flex; gap: 8px; }
  </style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="login-screen">
    <h1>冷旭帆</h1>
    <div class="form-group"><input type="text" id="login-username" placeholder="用户名" autocomplete="off"></div>
    <div class="form-group"><input type="password" id="login-password" placeholder="密码"></div>
    <button class="btn-primary" id="login-btn">登录</button>
    <button class="btn-secondary" id="register-btn">注册</button>
    <span class="guest-link" id="guest-link">以游客身份进入</span>
  </div>

  <!-- CHAT SCREEN -->
  <div id="chat-screen">
    <div id="header">
      <div class="title"><span class="dot"></span> 冷旭帆</div>
      <div class="actions">
        <button class="icon-btn" id="dev-toggle" title="开发者面板">⚙️</button>
        <button class="icon-btn" id="export-btn" title="导出对话">📥</button>
      </div>
    </div>
    <div id="messages"></div>
    <div id="dev-panel"></div>
    <div id="input-area">
      <input type="text" id="msg-input" placeholder="说点什么..." autocomplete="off">
      <button id="send-btn">↑</button>
    </div>
  </div>

  <!-- ANNOTATION MODAL -->
  <div id="annotation-modal">
    <div class="modal-content">
      <h4 style="margin-bottom:10px">标注这条消息</h4>
      <textarea id="annotation-text" placeholder="写点备注..."></textarea>
      <div class="modal-actions">
        <button class="btn-secondary" id="annotation-cancel">取消</button>
        <button class="btn-primary" id="annotation-save">保存</button>
      </div>
    </div>
  </div>

  <!-- EXPORT MODAL -->
  <div id="export-modal">
    <div class="modal-content">
      <h4 style="margin-bottom:10px">导出预览</h4>
      <div id="export-preview"></div>
      <div class="export-options">
        <button class="btn-secondary" id="export-cancel">关闭</button>
        <button class="btn-primary" id="export-txt">导出 TXT</button>
        <button class="btn-primary" id="export-md">导出 MD</button>
      </div>
    </div>
  </div>

  <script>
    // ---- State ----
    let currentUser = null;
    let messages = []; // { id, role, content, annotation, state? }
    let showDevPanel = false;
    let selectedMsgId = null;

    // ---- DOM ----
    const loginScreen = document.getElementById('login-screen');
    const chatScreen = document.getElementById('chat-screen');
    const messagesDiv = document.getElementById('messages');
    const devPanel = document.getElementById('dev-panel');
    const msgInput = document.getElementById('msg-input');
    const annotationModal = document.getElementById('annotation-modal');
    const annotationText = document.getElementById('annotation-text');
    const exportModal = document.getElementById('export-modal');
    const exportPreview = document.getElementById('export-preview');

    // ---- Auth ----
    async function api(url, method='GET', body=null) {
      const opts = { method, headers: {'Content-Type':'application/json'}, credentials:'same-origin' };
      if (body) opts.body = JSON.stringify(body);
      const res = await fetch(url, opts);
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error || res.statusText);
      }
      return res.json();
    }

    document.getElementById('login-btn').onclick = async () => {
      const u = document.getElementById('login-username').value.trim();
      const p = document.getElementById('login-password').value.trim();
      if (!u || !p) return alert('请输入用户名和密码');
      try {
        const data = await api('/api/login', 'POST', {username:u, password:p});
        currentUser = data;
        enterChat();
      } catch(e) { alert(e.message); }
    };
    document.getElementById('register-btn').onclick = async () => {
      const u = document.getElementById('login-username').value.trim();
      const p = document.getElementById('login-password').value.trim();
      if (!u || !p) return alert('请输入用户名和密码');
      try {
        const data = await api('/api/register', 'POST', {username:u, password:p});
        currentUser = data;
        enterChat();
      } catch(e) { alert(e.message); }
    };
    document.getElementById('guest-link').onclick = async () => {
      try {
        const data = await api('/api/guest', 'POST');
        currentUser = data;
        enterChat();
      } catch(e) { alert(e.message); }
    };

    async function enterChat() {
      loginScreen.style.display = 'none';
      chatScreen.style.display = 'flex';
      // 加载历史对话
      try {
        const history = await api('/api/conversations');
        messages = history;
        renderMessages();
      } catch(e) {}
      msgInput.focus();
    }

    // ---- Chat ----
    async function sendMessage() {
      const text = msgInput.value.trim();
      if (!text) return;
      msgInput.value = '';
      // 临时添加到界面
      messages.push({ role:'user', content: text });
      renderMessages();
      messagesDiv.scrollTop = messagesDiv.scrollHeight;

      try {
        const res = await api('/chat', 'POST', {message:text});
        const lxfMsg = {
          id: res.state ? res.state.message_id : null, // 后端未返回message_id，暂用null
          role: 'lxf',
          content: res.reply,
          state: res.state
        };
        messages.push(lxfMsg);
        renderMessages();
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
        if (showDevPanel) updateDevPanel(lxfMsg.state);
      } catch(e) {
        messages.push({ role:'lxf', content: '……（他沉默着，没有回答）' });
        renderMessages();
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      }
    }

    document.getElementById('send-btn').onclick = sendMessage;
    msgInput.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // ---- Render Messages ----
    function renderMessages() {
      messagesDiv.innerHTML = '';
      messages.forEach((msg, idx) => {
        const div = document.createElement('div');
        div.className = 'message ' + (msg.role === 'user' ? 'user' : 'lxf');
        div.dataset.index = idx;

        if (msg.role === 'lxf' && msg.content.includes('💭')) {
          const parts = msg.content.split('💭');
          div.textContent = parts[0].trim();
          const mono = document.createElement('div');
          mono.className = 'monologue';
          mono.textContent = '💭 ' + parts.slice(1).join('💭').trim();
          div.appendChild(mono);
        } else {
          div.textContent = msg.content;
        }

        // 标注标记
        if (msg.annotation) {
          const badge = document.createElement('span');
          badge.className = 'annotation-badge';
          badge.style.display = 'block';
          badge.textContent = 'i';
          div.appendChild(badge);
        }

        // 长按/右键事件
        div.addEventListener('contextmenu', e => {
          e.preventDefault();
          openAnnotationModal(idx);
        });
        // 移动端长按
        let pressTimer;
        div.addEventListener('touchstart', e => {
          pressTimer = setTimeout(() => openAnnotationModal(idx), 600);
        });
        div.addEventListener('touchend', () => clearTimeout(pressTimer));
        div.addEventListener('touchmove', () => clearTimeout(pressTimer));

        messagesDiv.appendChild(div);
      });
    }

    // ---- Dev Panel ----
    document.getElementById('dev-toggle').onclick = () => {
      showDevPanel = !showDevPanel;
      devPanel.style.display = showDevPanel ? 'block' : 'none';
      if (showDevPanel) {
        const lastLxf = [...messages].reverse().find(m => m.role === 'lxf');
        if (lastLxf && lastLxf.state) updateDevPanel(lastLxf.state);
      }
    };

    function updateDevPanel(state) {
      if (!state) return;
      let html = '';
      html += '<div class="dev-section"><h4>情绪</h4><span class="dev-value">'+state.emotion.toFixed(1)+' ('+getEmotionLabel(state.emotion)+')</span></div>';
      html += '<div class="dev-section"><h4>身体</h4><span class="dev-value">'+state.body+'</span></div>';
      html += '<div class="dev-section"><h4>心理</h4><span class="dev-value">'+state.mind+'</span></div>';
      html += '<div class="dev-section"><h4>关系</h4><span class="dev-value">'+state.relationship+'</span></div>';
      if (state.wang_claim) {
        html += '<div class="dev-section"><h4>望仔验证</h4><span class="dev-value">信任值:'+state.wang_trust+' | 证据:'+state.verified_evidence.join(', ')+'</span></div>';
        if (state.pending_question) html += '<div class="dev-section"><h4>追问</h4><span class="dev-value">'+state.pending_question+'</span></div>';
      }
      if (state.last_thought) html += '<div class="dev-section"><h4>思考链</h4><span class="dev-value">'+state.last_thought+'</span></div>';
      devPanel.innerHTML = html;
    }

    function getEmotionLabel(val) {
      if (val < 30) return '低落';
      if (val < 50) return '平静';
      if (val < 70) return '稍好';
      return '高涨';
    }

    // ---- Annotation ----
    function openAnnotationModal(idx) {
      selectedMsgId = messages[idx]?.id;
      annotationText.value = messages[idx]?.annotation || '';
      annotationModal.style.display = 'flex';
    }

    document.getElementById('annotation-cancel').onclick = () => {
      annotationModal.style.display = 'none';
      selectedMsgId = null;
    };
    document.getElementById('annotation-save').onclick = async () => {
      if (selectedMsgId == null) return;
      const text = annotationText.value.trim();
      try {
        await api('/api/conversations/'+selectedMsgId+'/annotate', 'PUT', {annotation:text});
        // 更新本地
        const msg = messages.find(m => m.id === selectedMsgId);
        if (msg) msg.annotation = text;
        renderMessages();
        annotationModal.style.display = 'none';
      } catch(e) { alert(e.message); }
    };

    // ---- Export ----
    document.getElementById('export-btn').onclick = () => {
      let preview = '';
      messages.forEach(m => {
        const label = m.role === 'user' ? '你' : '冷旭帆';
        preview += `[${label}] ${m.content}\n`;
        if (m.annotation) preview += `[标注] ${m.annotation}\n`;
        preview += '\n';
      });
      exportPreview.textContent = preview;
      exportModal.style.display = 'flex';
    };

    function download(content, filename, mime) {
      const blob = new Blob([content], {type: mime});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename; a.click();
      URL.revokeObjectURL(url);
    }

    document.getElementById('export-txt').onclick = () => {
      let text = '=== 冷旭帆 · 对话记录 ===\n\n';
      messages.forEach(m => {
        const label = m.role === 'user' ? '你' : '冷旭帆';
        text += `[${label}] ${m.content}\n`;
        if (m.annotation) text += `[标注] ${m.annotation}\n`;
        text += '\n';
      });
      download(text, `冷旭帆_对话_${new Date().toISOString().slice(0,10)}.txt`, 'text/plain');
    };

    document.getElementById('export-md').onclick = () => {
      let md = '# 冷旭帆 · 对话记录\n\n';
      messages.forEach(m => {
        const label = m.role === 'user' ? '**你**' : '**冷旭帆**';
        md += `${label}: ${m.content}\n\n`;
        if (m.annotation) md += `> 标注: ${m.annotation}\n\n`;
      });
      download(md, `冷旭帆_对话_${new Date().toISOString().slice(0,10)}.md`, 'text/markdown');
    };

    document.getElementById('export-cancel').onclick = () => exportModal.style.display = 'none';
    // 点击遮罩关闭
    exportModal.addEventListener('click', e => { if (e.target === exportModal) exportModal.style.display = 'none'; });
    annotationModal.addEventListener('click', e => { if (e.target === annotationModal) annotationModal.style.display = 'none'; });
  </script>
</body>
</html>
