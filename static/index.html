<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>冷旭帆</title>
    <link rel="manifest" href="/manifest.json">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0d1117; color: #c9d1d9; font-family: -apple-system, "Microsoft YaHei", sans-serif; height: 100vh; display: flex; flex-direction: column; }
        #header { background: #161b22; padding: 8px 16px; border-bottom: 1px solid #21262d; font-size: 14px; color: #8b949e; display: flex; align-items: center; justify-content: space-between; }
        #header .left { display: flex; align-items: center; gap: 8px; }
        #header .dot { width: 8px; height: 8px; background: #3fb950; border-radius: 50%; display: inline-block; }
        #header .actions { display: flex; gap: 8px; }
        .header-btn { background: #21262d; color: #8b949e; border: 1px solid #30363d; padding: 4px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; }
        #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 15px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
        .user { align-self: flex-end; background: #238636; color: #fff; }
        .lxf { align-self: flex-start; background: #21262d; color: #c9d1d9; border: 1px solid #30363d; }
        .lxf .monologue { color: #8b949e; font-style: italic; margin-top: 6px; padding-top: 6px; border-top: 1px solid #30363d; font-size: 13px; }
        #input-area { background: #161b22; padding: 10px 12px; border-top: 1px solid #21262d; display: flex; gap: 8px; }
        #msg { flex: 1; padding: 10px 14px; background: #0d1117; border: 1px solid #30363d; border-radius: 20px; color: #c9d1d9; font-size: 15px; outline: none; }
        #msg:focus { border-color: #58a6ff; }
        button { width: 44px; height: 44px; background: #238636; border: none; border-radius: 50%; color: white; font-size: 18px; cursor: pointer; flex-shrink: 0; }
        button:active { background: #2ea043; }
        button:disabled { background: #21262d; color: #484f58; }
        .typing { color: #8b949e; font-size: 13px; padding: 8px 14px; }
    </style>
</head>
<body>
    <div id="header">
        <div class="left"><span class="dot"></span> 冷旭帆 · 在线</div>
        <div class="actions"><button class="header-btn" onclick="exportChat()">导出对话</button></div>
    </div>
    <div id="chat"></div>
    <div id="input-area">
        <input id="msg" placeholder="说点什么..." autocomplete="off">
        <button onclick="send()" id="send-btn">↑</button>
    </div>
    <script>
        const API = '/chat';
        const chat = document.getElementById('chat');
        const input = document.getElementById('msg');
        const btn = document.getElementById('send-btn');
        let chatHistory = [];
        async function send() {
            const msg = input.value.trim();
            if (!msg) return;
            addBubble(msg, 'user');
            chatHistory.push({role: 'user', text: msg, time: new Date().toLocaleTimeString()});
            input.value = '';
            btn.disabled = true;
            showTyping();
            try {
                const res = await fetch(API, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({message: msg}) });
                const data = await res.json();
                removeTyping();
                addBubble(data.reply, 'lxf');
                chatHistory.push({role: 'lxf', text: data.reply, time: new Date().toLocaleTimeString()});
            } catch(e) {
                removeTyping();
                addBubble('……（他沉默着，没有回答）', 'lxf');
                chatHistory.push({role: 'lxf', text: '……（他沉默着，没有回答）', time: new Date().toLocaleTimeString()});
            }
            btn.disabled = false;
            chat.scrollTop = chat.scrollHeight;
            input.focus();
        }
        function addBubble(text, type) {
            const div = document.createElement('div');
            div.className = 'msg ' + type;
            if (type === 'lxf' && text.includes('💭')) {
                const parts = text.split('💭');
                div.textContent = parts[0].trim();
                const mono = document.createElement('div');
                mono.className = 'monologue';
                mono.textContent = '💭 ' + parts[1].trim();
                div.appendChild(mono);
            } else { div.textContent = text; }
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }
        function showTyping() {
            const div = document.createElement('div'); div.className = 'typing'; div.id = 'typing'; div.textContent = '冷旭帆正在输入...';
            chat.appendChild(div); chat.scrollTop = chat.scrollHeight;
        }
        function removeTyping() { const el = document.getElementById('typing'); if (el) el.remove(); }
        function exportChat() {
            if (chatHistory.length === 0) return;
            let text = '=== 冷旭帆 · 对话记录 ===\n导出时间: ' + new Date().toLocaleString() + '\n\n';
            for (const entry of chatHistory) {
                const label = entry.role === 'user' ? '你' : '冷旭帆';
                text += '[' + entry.time + '] ' + label + ': ' + entry.text + '\n\n';
            }
            const blob = new Blob([text], {type: 'text/plain;charset=utf-8'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = '冷旭帆_对话记录_' + new Date().toISOString().slice(0,10) + '.txt'; a.click();
            URL.revokeObjectURL(url);
        }
        input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
        input.focus();
        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw.js'); }
    </script>
</body>
</html>
