<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冷旭帆 · 开发者面板</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0d1117; color: #c9d1d9; font-family: -apple-system, "Microsoft YaHei", monospace; padding: 16px; max-width: 600px; margin: 0 auto; }
        h2 { font-size: 16px; margin: 16px 0 8px; color: #58a6ff; }
        .card { background: #161b22; border: 1px solid #21262d; border-radius: 8px; padding: 12px; margin-bottom: 8px; }
        .label { color: #8b949e; font-size: 12px; }
        .value { color: #c9d1d9; font-size: 14px; margin-top: 4px; }
        #login { text-align: center; padding: 40px 0; }
        #login input { padding: 10px; background: #0d1117; border: 1px solid #30363d; color: #c9d1d9; border-radius: 6px; margin-right: 8px; }
        #login button { padding: 10px 20px; background: #238636; border: none; color: white; border-radius: 6px; }
        #dashboard { display: none; }
        .refresh-hint { font-size: 11px; color: #484f58; text-align: center; margin-top: 16px; }
    </style>
</head>
<body>
    <div id="login">
        <h2>开发者模式</h2>
        <p style="color:#8b949e;margin:12px 0">输入密码查看系统内部状态</p>
        <input id="pwd" type="password" placeholder="密码">
        <button onclick="login()">进入</button>
    </div>
    <div id="dashboard">
        <h2>情绪</h2>
        <div class="card"><div class="label">当前情绪值</div><div class="value" id="emotion">-</div></div>
        <h2>身体状态</h2>
        <div class="card"><div class="value" id="body-state">-</div></div>
        <h2>心理状态</h2>
        <div class="card"><div class="value" id="mind-state">-</div></div>
        <h2>关系动态</h2>
        <div class="card"><div class="label">阶段 / 信任值</div><div class="value" id="rel-stage">-</div></div>
        <h2>望仔验证</h2>
        <div class="card" id="wang-card" style="display:none"><div class="label">验证阶段 / 信任值 / 已验证证据</div><div class="value" id="wang-state">-</div></div>
        <h2>记忆（最近5条）</h2>
        <div class="card"><div class="value" id="memories" style="font-size:12px">-</div></div>
        <h2>思考链</h2>
        <div class="card"><div class="value" id="thought" style="font-size:12px">-</div></div>
        <p class="refresh-hint">每2秒自动刷新</p>
    </div>
    <script>
        const PASSWORD = 'yingying2024';
        let authed = false;
        async function login() {
            if (document.getElementById('pwd').value === PASSWORD) {
                authed = true;
                document.getElementById('login').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                setInterval(refreshState, 2000);
                refreshState();
            } else { alert('密码错误'); }
        }
        async function refreshState() {
            if (!authed) return;
            try {
                const res = await fetch('/dev-state');
                const s = await res.json();
                document.getElementById('emotion').textContent = s.emotion.toFixed(1) + ' (' + s.emotion_label + ')';
                document.getElementById('body-state').textContent = s.body;
                document.getElementById('mind-state').textContent = s.mind;
                document.getElementById('rel-stage').textContent = s.relationship;
                if (s.wang_claim) {
                    document.getElementById('wang-card').style.display = 'block';
                    document.getElementById('wang-state').textContent = s.wang_state + ' | 证据: ' + s.verified_evidence.join(', ');
                }
                document.getElementById('memories').textContent = s.recent_memories.join('\n') || '无';
                document.getElementById('thought').textContent = s.last_thought || '无';
            } catch(e) {}
        }
    </script>
</body>
</html>
