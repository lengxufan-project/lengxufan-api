<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星光交织图谱</title>
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/relation-map.css">
</head>
<body>
<div class="rm-page">

  <!-- 顶部导航 -->
  <header class="rm-nav">
    <button class="rm-back" type="button" onclick="location.href='index.html'">← 返回世界</button>
    <h1 class="rm-title">星光交织图谱</h1>
    <span class="rm-nav-spacer"></span>
  </header>

  <!-- 中央：SVG 关系网络画布 -->
  <div class="rm-stage" id="rmStage">
    <div class="rm-world" id="rmWorld">
      <svg id="rmSvg" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>
      <!-- 角色节点由 js/relation-map.js 注入 -->
    </div>
  </div>

  <!-- 底部提示：角色名列表，点击切换焦点 -->
  <footer class="rm-legend">
    <span class="rm-legend-hint">点击角色切换焦点：</span>
    <div class="rm-chips" id="rmChips"></div>
  </footer>

</div>
<script src="js/relation-map.js"></script>
</body>
</html>
