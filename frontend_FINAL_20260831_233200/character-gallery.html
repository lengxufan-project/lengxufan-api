<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>群像画廊</title>
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/character-gallery.css">
</head>
<body>
<div class="cg-page">

  <!-- 顶部：返回 + 标题 -->
  <header class="cg-nav">
    <button class="cg-back" type="button" onclick="location.href='index.html?skipIntro=1'">← 返回世界</button>
    <h1 class="cg-title">群像画廊</h1>
    <span class="cg-nav-spacer"></span>
  </header>

  <!-- 全屏网格：角色卡片由 js/character-gallery.js 注入 -->
  <main class="cg-grid" id="cgGrid">
    <!-- 卡片结构（由 JS 动态生成）：
    <article class="cg-card cg-env-blue">
      <div class="cg-card-inner">
        <div class="cg-stage">
          <div class="cg-glow"></div>
          <div class="cg-silhouette"></div>
        </div>
        <div class="cg-meta">
          <h2 class="cg-name">冷旭帆</h2>
          <p class="cg-identity">307室 · 观察者</p>
        </div>
      </div>
    </article>
    -->
  </main>

  <!-- 底部提示 -->
  <footer class="cg-footer">
    <span class="cg-hint">点击卡片进入人物典籍</span>
  </footer>

</div>
<script src="js/character-gallery.js"></script>
</body>
</html>
