<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>导出对话 · 时光档案馆</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/export.css" />
</head>
<body class="export-page">
  <a href="index.html?skipIntro=1" class="return-btn">← 返回主界面</a>

  <h1 class="page-title">📦 时光档案馆 · 对话导出</h1>
  <p class="page-subtitle">将珍贵的对话记忆打包带走，随时翻开再看</p>

  <main class="export-panel">
    <!-- 过滤条件 -->
    <section class="filter-section">
      <h2 class="section-title">🔍 过滤条件</h2>
      <div class="filter-row">
        <div class="filter-item">
          <label for="charSelect">选择角色</label>
          <select id="charSelect" class="form-control">
            <option value="all">全部角色</option>
          </select>
        </div>
        <div class="filter-item">
          <label for="dateFrom">起始日期</label>
          <input type="date" id="dateFrom" class="form-control" />
        </div>
        <div class="filter-item">
          <label for="dateTo">结束日期</label>
          <input type="date" id="dateTo" class="form-control" />
        </div>
      </div>
    </section>

    <!-- 格式选择 -->
    <section class="format-section">
      <h2 class="section-title">📄 选择格式</h2>
      <div class="format-group">
        <button class="format-btn active" data-format="json">
          <span class="format-icon">{ }</span>
          <span class="format-name">JSON</span>
          <span class="format-desc">结构化数据，便于二次处理</span>
          <span class="ripple"></span>
        </button>
        <button class="format-btn" data-format="md">
          <span class="format-icon">##</span>
          <span class="format-name">Markdown</span>
          <span class="format-desc">阅读友好，支持排版展示</span>
          <span class="ripple"></span>
        </button>
        <button class="format-btn" data-format="txt">
          <span class="format-icon">TXT</span>
          <span class="format-name">纯文本</span>
          <span class="format-desc">轻量简洁，任意设备打开</span>
          <span class="ripple"></span>
        </button>
      </div>
    </section>

    <!-- 统计信息 -->
    <section class="stats-section">
      <div class="stat-card">
        <div class="stat-value" id="statCount">0</div>
        <div class="stat-label">匹配对话数</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statChars">0</div>
        <div class="stat-label">字符总数</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statSize">0 KB</div>
        <div class="stat-label">预计文件大小</div>
      </div>
    </section>

    <!-- 导出按钮 + 进度条 -->
    <section class="action-section">
      <button id="exportBtn" class="export-btn">
        <span class="btn-icon">⬇️</span>
        <span class="btn-text">开始导出</span>
      </button>

      <div class="progress-wrapper" id="progressWrapper" style="display:none;">
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill">
            <span class="progress-shine"></span>
          </div>
        </div>
        <div class="progress-info">
          <span id="progressText">准备中…</span>
          <span id="progressPercent">0%</span>
        </div>
      </div>

      <div id="statusMsg" class="status-msg"></div>
    </section>
  </main>

  <script src="js/export.js"></script>
</body>
</html>
