<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>冷旭帆 · 世界入口</title>
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/login.css">
</head>
<body>
  <!-- 中央巨大发光球（纯 CSS 绘制，缓慢脉动） -->
  <div class="login-ball" id="loginBall"></div>

  <div class="login-wrap">
    <h1 class="login-title">世界入口</h1>

    <form class="login-form" id="loginForm">
      <input type="text" id="username" placeholder="用户名" autocomplete="username">
      <input type="password" id="password" placeholder="密码" autocomplete="current-password">
      <button type="submit" id="submitBtn">登录</button>
      <button type="button" class="guest-btn" id="guestBtn">游客进入</button>
      <div class="link"><a href="javascript:void(0)" id="switchLink">没有账号？注册</a></div>
      <div class="login-error" id="loginError"></div>
    </form>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
