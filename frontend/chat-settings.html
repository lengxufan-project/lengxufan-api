<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>聊天设置</title>
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/chat-settings.css">
</head>
<body>
<div class="page">

  <!-- 顶部栏 -->
  <header class="page-topbar">
    <a class="back-btn" href="index.html?skipIntro=1">← 返回</a>
    <span class="page-title">聊天设置</span>
    <span class="topbar-spacer"></span>
  </header>

  <!-- 内容区 -->
  <main class="page-body">

    <div class="setting-item" data-status="stub">
      <span class="setting-label">查找聊天记录</span>
      <span class="setting-arrow">›</span>
    </div>

    <div class="setting-item" data-status="stub">
      <span class="setting-label">消息免打扰</span>
      <span class="setting-arrow">›</span>
    </div>

    <div class="setting-item" data-status="stub">
      <span class="setting-label">置顶聊天</span>
      <span class="setting-arrow">›</span>
    </div>

    <div class="setting-item" data-status="stub">
      <span class="setting-label">提醒</span>
      <span class="setting-arrow">›</span>
    </div>

    <div class="setting-item" data-status="stub">
      <span class="setting-label">设置当前聊天背景</span>
      <span class="setting-arrow">›</span>
    </div>

    <div class="setting-item" data-status="stub">
      <span class="setting-label">清空聊天记录</span>
      <span class="setting-arrow">›</span>
    </div>

    <div class="setting-item setting-item-danger" data-status="plan">
      <span class="setting-label">投诉</span>
      <span class="setting-arrow">›</span>
    </div>

  </main>

</div>
<script src="js/chat-settings.js"></script>
