<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星图导航</title>
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/world-map.css">
</head>
<body>
<div class="wm-page">

  <!-- 全屏星图背景 -->
  <div class="wm-stars" id="wmStars" aria-hidden="true"></div>

  <!-- 顶部：返回按钮 + 标题 -->
  <header class="wm-nav">
    <a class="wm-back page-back-btn" href="index.html?skipIntro=1" onclick="event.preventDefault();goBack()">← 返回</a>
    <h1 class="wm-title page-title">星图导航</h1>
    <span class="wm-nav-spacer"></span>
  </header>

  <!-- 中央：SVG 星空，5 个场景节点 -->
  <div class="wm-stage" id="wmStage">
    <svg id="wmSvg" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
      <defs>
        <!-- 星云渐变（紫色） -->
        <radialGradient id="nebulaPurple" cx="50%" cy="50%" r="50%">
          <stop offset="0%"  stop-color="rgba(120,80,200,0.35)" />
          <stop offset="60%" stop-color="rgba(120,80,200,0.06)" />
          <stop offset="100%" stop-color="rgba(120,80,200,0)" />
        </radialGradient>
        <!-- 星云渐变（青蓝） -->
        <radialGradient id="nebulaCyan" cx="50%" cy="50%" r="50%">
          <stop offset="0%"  stop-color="rgba(88,166,255,0.3)" />
          <stop offset="60%" stop-color="rgba(88,166,255,0.05)" />
          <stop offset="100%" stop-color="rgba(88,166,255,0)" />
        </radialGradient>
        <!-- 节点光晕渐变 -->
        <radialGradient id="nodeGlow" cx="35%" cy="30%" r="65%">
          <stop offset="0%"  stop-color="#ffffff" />
          <stop offset="35%" stop-color="#bfe0ff" />
          <stop offset="75%" stop-color="#58a6ff" />
          <stop offset="100%" stop-color="#1a2a4a" />
        </radialGradient>
        <!-- 连线渐变 -->
        <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%"   stop-color="rgba(88,166,255,0.15)" />
          <stop offset="50%"  stop-color="rgba(191,224,255,0.6)" />
          <stop offset="100%" stop-color="rgba(88,166,255,0.15)" />
        </linearGradient>
      </defs>
      <!-- 星云光晕（装饰层，在连线下方） -->
      <ellipse cx="220" cy="160" rx="220" ry="140" fill="url(#nebulaPurple)" />
      <ellipse cx="780" cy="440" rx="260" ry="160" fill="url(#nebulaCyan)" />
      <ellipse cx="500" cy="300" rx="340" ry="180" fill="url(#nebulaCyan)" opacity="0.3" />
      <!-- 连线由 js/world-map.js 注入 -->
    </svg>
    <div class="wm-nodes" id="wmNodes">
      <!-- 节点由 js/world-map.js 注入 -->
    </div>
    <!-- 光点滑行轨迹 -->
    <div class="map-traveler" id="mapTraveler" aria-hidden="true"></div>
  </div>

  <!-- 底部：场景名称列表 -->
  <footer class="wm-legend">
    <span class="wm-legend-hint">点击星点切换场景</span>
    <div class="wm-chips" id="wmChips"></div>
  </footer>

</div>
<script src="js/world-map.js"></script>
</body>
</html>
