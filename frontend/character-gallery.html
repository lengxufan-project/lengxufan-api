<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>角色图鉴</title>
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/character-gallery.css">
</head>
<body>
<div class="cg-page">

  <!-- 顶部导航 -->
  <header class="cg-nav">
    <button class="cg-back" type="button" onclick="goBack()">← 返回世界</button>
    <h1 class="cg-title">角色图鉴</h1>
    <span class="cg-nav-spacer"></span>
  </header>

  <!-- 搜索与标签筛选 -->
  <div class="cg-filter">
    <div class="cg-search">
      <span class="cg-search-icon">🔍</span>
      <input type="text" class="cg-search-input" id="cgSearch" placeholder="搜索角色名称..." autocomplete="off">
    </div>
    <div class="cg-tags" id="cgTags"></div>
  </div>

  <!-- 角色网格 -->
  <main class="cg-grid" id="cgGrid"></main>

  <!-- 分页控制 -->
  <footer class="cg-pager" id="cgPager">
    <div class="cg-pager-controls">
      <button class="cg-pager-btn" id="cgPagerPrev">← 上一页</button>
      <span class="cg-pager-text" id="cgPagerText">1 / 1</span>
      <button class="cg-pager-btn" id="cgPagerNext">下一页 →</button>
    </div>
  </footer>

</div>
<script src="js/character-gallery.js"></script>
</body>
</html>
