<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>冷旭帆 · 世界观察中心</title>
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/sidebar.css">
<link rel="stylesheet" href="css/search-panel.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/scene-transition.css">
<link rel="stylesheet" href="css/world-clock.css">
<link rel="stylesheet" href="css/loading-bar.css">
<link rel="stylesheet" href="css/scene-shortcut.css">
<link rel="stylesheet" href="css/weather-effects.css">
<link rel="stylesheet" href="css/time-lighting.css">
<link rel="stylesheet" href="css/emotion-particles.css">
<link rel="stylesheet" href="css/notification-center.css">
</head>
<body>
<div id="loadingBar"></div>
  <div id="globalParticles"></div>

  <!-- 开场动画（非对称电影感构图：左侧文字 / 右下光球，点击"进入世界"后进入主界面） -->
  <div class="intro" id="intro">
    <div class="intro-noise"></div>
    <div class="intro-particles">
      <div class="p-layer p-bg" id="introParticlesBg"></div>
      <div class="p-layer p-mid" id="introParticlesMid"></div>
      <div class="p-layer p-front" id="introParticlesFront"></div>
    </div>
    <div class="intro-orb" id="introOrb">
      <span class="orb-ripple r1"></span>
      <span class="orb-ripple r2"></span>
      <span class="orb-ripple r3"></span>
    </div>
    <div class="intro-text-block">
      <h1 class="intro-title" id="introTitle">冷旭帆 · 世界入口</h1>
      <div class="intro-sub" id="introSub">世界正在苏醒</div>
    </div>
    <button class="intro-enter" id="introEnter" type="button">进入世界</button>
  </div>

  <!-- 应用主容器（固定视口矩形，A4 纸式布局，不受浏览器缩放影响） -->
  <div class="app" id="app">
    <!-- 移动端遮罩（侧边栏展开时半透明背景，点击关闭） -->
    <div class="sidebar-mask" id="sidebarMask"></div>

    <!-- 左侧可收起侧边栏（微信/QQ 式交互 + 暗黑磨砂） -->
    <div class="sidebar" id="sidebar">
      <!-- 顶部条：开关 / 标题 / 通知图标 -->
      <div class="sidebar-topbar">
        <div class="sidebar-toggle" id="sidebarToggle" title="收起/展开">☰</div>
        <span class="sidebar-title">世界入口</span>
        <button class="sidebar-notify" id="sidebarNotify" type="button" aria-label="通知">
          <span class="notify-bell"></span>
          <span class="notify-dot"></span>
        </button>
      </div>

      <!-- 搜索框：胶囊形磨砂，聚焦冰蓝发光，点击唤起全局搜索面板 -->
      <div class="sidebar-search" id="searchTrigger">
        <span class="search-icon">🔍</span>
        <input type="text" class="search-input" placeholder="搜索角色 / 场景 / 档案" readonly autocomplete="off" />
      </div>

      <nav class="sidebar-nav">
        <!-- 世界组 -->
        <div class="nav-group-title">世界</div>
        <a href="index.html?skipIntro=1" class="nav-link">世界入口</a>
        <a href="world-map.html" class="nav-link">星图导航</a>

        <!-- 档案组 -->
        <div class="nav-group-title">档案</div>
        <a href="character-gallery.html" class="nav-link">角色图鉴</a>
        <a href="memory-gallery.html" class="nav-link">时光回廊</a>
        <a href="relation-map.html" class="nav-link">关系图谱</a>

        <!-- 观测组 -->
        <div class="nav-group-title">观测</div>
        <a href="observer-panel.html" class="nav-link">观察者之窗</a>

        <!-- 系统组 -->
        <div class="nav-group-title">系统</div>
        <a href="settings.html" class="nav-link">设置</a>
        <a href="about.html" class="nav-link">关于</a>
      </nav>


    </div>

    <!-- 通知抽屉遮罩（抽屉打开时显示，点击关闭） -->
    <div class="notify-mask" id="notifyMask"></div>

    <!-- 通知抽屉（点击通知图标展开，右侧滑入，磨砂玻璃） -->
    <div class="notify-drawer" id="notifyDrawer">
      <div class="notify-drawer-head">
        <span class="notify-drawer-title">通知</span>
        <button class="notify-drawer-markall" id="notifyMarkAll" type="button">全部标为已读</button>
        <button class="notify-drawer-close" id="notifyClose" type="button" aria-label="关闭">×</button>
      </div>
      <div class="notify-drawer-body" id="notifyList">
        <!-- 未读分组 -->
        <div class="notify-section notify-unread" id="notifyUnread">
          <div class="notify-section-title">未读</div>
          <div class="notify-section-list" data-group="unread"></div>
        </div>
        <!-- 已读分组 -->
        <div class="notify-section notify-read" id="notifyRead">
          <div class="notify-section-title">已读</div>
          <div class="notify-section-list" data-group="read"></div>
        </div>
        <!-- 空状态兜底 -->
        <div class="notify-empty" id="notifyEmpty" style="display:none">暂无通知</div>
      </div>
    </div>

    <!-- 世界观察中心：全屏场景（相对 #app 定位，左侧让给 sidebar） -->
    <div class="scene fullscreen" id="scene">
      <!-- 场景区顶部磨砂信息条：世界日 / 时段 / 天气 / 时间 -->
      <div class="scene-topbar" id="sceneTopbar">
        <div class="st-item">
          <span class="st-indicator"></span>
          <span class="st-label">世界日</span>
          <span class="st-value" id="stDay">--</span>
        </div>
        <div class="st-divider"></div>
        <div class="st-item">
          <span class="st-label">时段</span>
          <span class="st-value" id="stPhase">--</span>
        </div>
        <div class="st-divider"></div>
        <div class="st-item">
          <span class="st-label">天气</span>
          <span class="st-value" id="stWeather">--</span>
        </div>
        <div class="st-divider"></div>
        <div class="st-item">
          <span class="st-label">时间</span>
          <span class="st-value" id="stTime">--:--</span>
        </div>
      </div>

      <div class="scene-label" id="sceneLabel">307室 · --</div>
      <div class="scene-meta" id="sceneMeta">第--天 · --</div>
      <div class="scene-acts" id="sceneActs"></div>
    </div>

    <!-- 悬浮球（开场动画终点，相对 #app 定位） -->
    <div id="floatingBall" class="floating-ball"></div>
  </div>

  <script src="js/loading-bar.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/scene-transition.js"></script>
  <script src="js/world-clock.js"></script>
  <script src="js/time-lighting.js"></script>
  <script src="js/emotion-particles.js"></script>
  <script src="js/scene-shortcut.js"></script>
  <script src="js/weather-effects.js"></script>
  <script src="js/search-panel.js"></script>
  <script src="js/app.js"></script>
  <script src="js/notification-center.js"></script>
</body>
</html>
