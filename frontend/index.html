<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>冷旭帆 · 世界观察中心</title>
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/sidebar.css">
<link rel="stylesheet" href="css/search-panel.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/scene-transition.css">
<link rel="stylesheet" href="css/world-clock.css">
<link rel="stylesheet" href="css/loading-bar.css">
<link rel="stylesheet" href="css/scene-shortcut.css">
<link rel="stylesheet" href="css/weather-effects.css">
<link rel="stylesheet" href="css/time-lighting.css">
<link rel="stylesheet" href="css/emotion-particles.css">
<link rel="stylesheet" href="css/notification-center.css">
</head>
<body>
<div id="loadingBar"></div>
  <!-- 移动端独立汉堡按钮（放在 .app 外，避免被侧边栏定位影响） -->
  <button class="mobile-menu-btn" id="mobileMenuBtn" type="button" aria-label="菜单">☰</button>
  <!-- 统一全局背景层（星空渐变 + 粒子，所有页面共享） -->
  <div id="globalBg"></div>

  <!-- 开场动画：世界苏醒 → 粒子汇聚成球 → 延伸曲线 → 移动衔接主页面 -->
  <div class="intro" id="intro">
    <div class="intro-stage" id="introStage">
      <div class="intro-sphere" id="introSphere"></div>
      <div class="intro-curves" id="introCurves"></div>
    </div>
  </div>

  <!-- 应用主容器（固定视口矩形，A4 纸式布局，不受浏览器缩放影响） -->
  <div class="app" id="app">
    <!-- 移动端遮罩（侧边栏展开时半透明背景，点击关闭） -->
    <div class="sidebar-mask" id="sidebarMask"></div>
    <!-- 第一栏：领域导航（极窄图标列） -->
    <div class="rail" id="rail">
      <div class="rail-item active" data-view="world" title="世界">◆</div>
      <div class="rail-item" data-view="roster" title="角色名册">◈</div>
      <div class="rail-item" data-view="chat" title="对话">☰</div>
      <div class="rail-item" data-view="memory" title="回忆">◉</div>
      <div class="rail-item" data-view="settings" title="设置">⚙</div>
    </div>

    <!-- 左侧可收起侧边栏（微信/QQ 式交互 + 暗黑磨砂） -->
    <div class="sidebar" id="sidebar">
      <!-- 顶部条：开关 / 标题 / 通知图标 -->
      <div class="sidebar-topbar">
        <div class="sidebar-toggle" id="sidebarToggle" title="收起/展开">☰</div>
        <span class="sidebar-title">世界入口</span>
        <button class="sidebar-notify" id="sidebarNotify" type="button" aria-label="通知">
          <span class="notify-bell"></span>
          
        </button>
      </div>

      <!-- 搜索框：胶囊形磨砂，聚焦冰蓝发光，点击唤起全局搜索面板 -->
      <div class="sidebar-search" id="searchTrigger">
        <span class="search-icon">🔍</span>
        <input type="text" class="search-input" placeholder="搜索角色 / 场景 / 档案" readonly autocomplete="off" />
      </div>

      <!-- 第二栏多面板：随第一栏 rail 切换显示（对话 / 当前角色 / 回忆 / 设置） -->
      <div class="sb-body" id="sbBody">
        <div class="sb-panel sb-panel-world" data-panel="world">
          <div class="sb-panel-title">世界状态</div>
          <div class="sb-world-summary">
            <div class="sb-world-item">场景：307室</div>
            <div class="sb-world-item">时段：夜晚</div>
            <div class="sb-world-item">天气：晴</div>
            <div class="sb-world-item">室友：3 人在活动</div>
          </div>
        </div>
        <div class="sb-panel sb-panel-chat" data-panel="chat">
          <div class="sb-panel-title">对话</div>
          <div class="sb-list">
            <a class="sb-entry-link" href="chat.html">进入单聊</a>
            <a class="sb-entry-link" href="chat.html?group=1">进入群聊</a>
          </div>
        </div>
        <div class="sb-panel sb-panel-characters active" data-panel="characters">
          <div class="sb-panel-title">当前角色</div>
          <div class="sb-list" id="sbCharList">
            <div class="char-item" data-char="lengxufan">
              <span class="char-dot"></span>
              <span class="char-name">冷旭帆</span>
              <span class="char-emotion">稍好</span>
            </div>
            <div class="char-item" data-char="huangjingyun">
              <span class="char-dot"></span>
              <span class="char-name">黄景云</span>
              <span class="char-emotion">平静</span>
            </div>
            <div class="char-item" data-char="yeqingci">
              <span class="char-dot"></span>
              <span class="char-name">叶清辞</span>
              <span class="char-emotion">低落</span>
            </div>
            <a class="sb-entry-link" href="character-gallery.html">查看全部角色 →</a>
          </div>
        </div>
        <div class="sb-panel sb-panel-memory" data-panel="memory">
          <div class="sb-panel-title">回忆</div>
          <div class="sb-list">
            <a class="sb-entry-link" href="memory-gallery.html">时光回廊</a>
            <a class="sb-entry-link" href="relation-map.html">关系图谱</a>
            <a class="sb-entry-link" href="observer-panel.html">观察者之窗</a>
            <a class="sb-entry-link" href="journey.html">旅程时间线</a>
          </div>
        </div>
        <div class="sb-panel sb-panel-settings" data-panel="settings">
          <div class="sb-panel-title">设置</div>
          <div class="sb-list">
            <a class="sb-entry-link" href="settings.html">设置页面</a>
            <a class="sb-entry-link" href="profile.html">个人中心</a>
            <a class="sb-entry-link" href="export.html">导出对话</a>
            <a class="sb-entry-link" href="about.html">关于</a>
            <a class="sb-entry-link" href="help.html">帮助</a>
          </div>
        </div>
      </div>

    </div>

    <!-- 通知抽屉遮罩（抽屉打开时显示，点击关闭） -->
    <div class="notify-mask" id="notifyMask"></div>

    <!-- 通知抽屉（点击通知图标展开，右侧滑入，磨砂玻璃） -->
    <div class="notify-drawer" id="notifyDrawer">
      <div class="notify-drawer-head">
        <span class="notify-drawer-title">通知</span>
        <button class="notify-drawer-markall" id="notifyMarkAll" type="button">全部标为已读</button>
        <button class="notify-drawer-close" id="notifyClose" type="button" aria-label="关闭">×</button>
      </div>
      <div class="notify-drawer-body" id="notifyList">
        <!-- 未读分组 -->
        <div class="notify-section notify-unread" id="notifyUnread">
          <div class="notify-section-title">未读</div>
          <div class="notify-section-list" data-group="unread"></div>
        </div>
        <!-- 已读分组 -->
        <div class="notify-section notify-read" id="notifyRead">
          <div class="notify-section-title">已读</div>
          <div class="notify-section-list" data-group="read"></div>
        </div>
        <!-- 空状态兜底 -->
        <div class="notify-empty" id="notifyEmpty" style="display:none">暂无通知</div>
      </div>
    </div>

    <!-- 世界观察中心：全屏场景（相对 #app 定位，左侧让给 sidebar） -->
    <div class="scene fullscreen" id="scene">
      <!-- 场景区顶部磨砂信息条：世界日 / 时段 / 天气 / 时间 -->
      <div class="scene-topbar" id="sceneTopbar">
        <div class="st-item">
          <span class="st-indicator"></span>
          <span class="st-label">世界日</span>
          <span class="st-value" id="stDay">--</span>
        </div>
        <div class="st-divider"></div>
        <div class="st-item">
          <span class="st-label">时段</span>
          <span class="st-value" id="stPhase">--</span>
        </div>
        <div class="st-divider"></div>
        <div class="st-item">
          <span class="st-label">天气</span>
          <span class="st-value" id="stWeather">--</span>
        </div>
        <div class="st-divider"></div>
        <div class="st-item">
          <span class="st-label">时间</span>
          <span class="st-value" id="stTime">--:--</span>
        </div>
      </div>

      <!-- 核心视觉：粒子聚合球 + 动态曲线 -->
      <div class="core-visual" id="coreVisual"></div>

      <div class="scene-label" id="sceneLabel">307室 · --</div>
      <div class="scene-meta" id="sceneMeta">第--天 · --</div>
      <div class="scene-acts" id="sceneActs"></div>
    </div>
  </div>

  <script src="js/loading-bar.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/scene-transition.js"></script>
  <script src="js/world-clock.js"></script>
  <script src="js/time-lighting.js"></script>
  <script src="js/emotion-particles.js"></script>
  <script src="js/scene-shortcut.js"></script>
  <script src="js/weather-effects.js"></script>
  <script src="js/search-panel.js"></script>
  <script src="js/app.js"></script>
  <script src="js/notification-center.js"></script>
</body>
</html>
