<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>冷旭帆 · 对话</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/chat.css">
</head>
<body>
  <!-- 聊天页主容器（fixed 视口矩形，A4 纸式布局，不受浏览器缩放影响） -->
  <div class="cp-page">
    <!-- ===== 背景氛围层（极淡场景渐变 + 粒子 + 顶部暗角 + 角色光晕） ===== -->
    <div class="cp-atmosphere" aria-hidden="true"></div>
    <div class="cp-top-vignette" aria-hidden="true"></div>
    <div class="cp-bg-particles" aria-hidden="true"></div>
    <div class="cp-char-glow" id="charGlow" aria-hidden="true"></div>

    <!-- 状态抽屉遮罩（抽屉展开时显示，移动端全屏也需要） -->
    <div class="cp-drawer-mask" id="drawerMask"></div>

    <!-- 顶栏：返回 ← + 角色名 + 情绪标签 + 状态抽屉按钮 -->
    <header class="cp-topbar">
      <a class="cp-back" href="index.html?skipIntro=1" onclick="event.preventDefault();goBack()" title="返回">&larr; 返回</a>
      <div class="cp-char-info">
        <span class="cp-char-name" id="chatCharName">冷旭帆</span>
        <span class="cp-emotion-label" id="chatEmotionLabel">--</span>
        <a class="cp-detail-btn" id="chatDetailBtn" href="character-profile.html?char=lengxufan" title="详情" style="display:none">ℹ</a>
      </div>
      <a class="cp-chat-settings-btn" id="chatSettingsBtn" href="chat-settings.html" data-status="stub" title="聊天设置">⚙</a>
      <a class="cp-export-btn" href="export.html" title="导出聊天记录">📥</a>
      <button class="cp-status-toggle" id="statusToggle" type="button" aria-controls="statusDrawer" aria-expanded="false" title="状态">
        <span class="status-icon"></span>
      </button>
    </header>

    <!-- 聊天区 -->
    <main class="cp-chat-area" id="chatArea"></main>

    <!-- 输入区：极大圆角 + 磨砂玻璃 + 表情/语音占位 -->
    <footer class="cp-input-bar">
      <div class="cp-input-tools" aria-hidden="true">
        <button class="cp-tool-btn" type="button" title="表情（占位）" data-status="stub">😊</button>
        <button class="cp-tool-btn" type="button" title="文件（占位）" data-status="stub">📎</button>
        <button class="cp-tool-btn" type="button" title="语音（占位）" data-status="stub">🎙️</button>
      </div>
      <div class="cp-input-wrap">
        <textarea class="cp-input" id="chatInput" rows="1" placeholder="说点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
      </div>
      <button class="cp-send" id="sendBtn" type="button" disabled>发送</button>
    </footer>

    <!-- 状态抽屉（从右侧滑出，桌面 300px / 移动全屏） -->
    <aside class="cp-status-drawer" id="statusDrawer" aria-hidden="true">
      <div class="cp-drawer-header">
        <span class="cp-drawer-title">状态面板</span>
        <button class="cp-drawer-close" id="statusClose" type="button" aria-label="关闭">×</button>
      </div>
      <div class="cp-drawer-body">
        <section class="cp-drawer-block">
          <h4>情绪曲线</h4>
          <div class="cp-chart-host" id="drawerChart"></div>
        </section>
        <section class="cp-drawer-block">
          <h4>身体</h4>
          <p id="drawerBody">--</p>
        </section>
        <section class="cp-drawer-block">
          <h4>心理</h4>
          <p id="drawerMind">--</p>
        </section>
        <section class="cp-drawer-block">
          <h4>关系</h4>
          <p id="drawerRelation">--</p>
        </section>
        <section class="cp-drawer-block cp-drawer-env">
          <h4>环境</h4>
          <p>天气：<span id="drawerWeather">--</span></p>
          <p>时间：<span id="drawerTime">--</span></p>
        </section>
      </div>
    </aside>

    <!-- 长按菜单 -->
    <div class="cp-context-menu" id="contextMenu" style="display:none">
      <div class="context-menu-item" data-action="copy">复制</div>
      <div class="context-menu-item" data-action="quote" data-stub="1">引用（开发中）</div>
      <div class="context-menu-item" data-action="recall" data-stub="1">撤回（开发中）</div>
      <div class="context-menu-item" data-action="multiselect" data-stub="1">多选（开发中）</div>
    </div>

    <!-- Toast 提示 -->
    <div class="cp-toast" id="cpToast" style="display:none"></div>
  </div>

  <script src="js/chat.js"></script>
</body>
</html>
