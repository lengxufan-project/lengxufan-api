<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>世界动态</title>
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/world-feed.css">
</head>
<body>
<div class="page">

  <!-- 顶部栏 -->
  <header class="page-topbar">
    <a class="back-btn" href="index.html?skipIntro=1">← 返回</a>
    <span class="page-title">世界动态</span>
    <span class="topbar-spacer"></span>
  </header>

  <!-- 发布框 -->
  <div class="post-box" data-status="plan">
    <div class="post-box-avatar"></div>
    <div class="post-box-input">分享此刻...</div>
    <div class="post-box-btn">发布</div>
  </div>

  <!-- 动态流 -->
  <main class="page-body">

    <!-- 动态卡片 1 -->
    <div class="feed-card" data-status="stub">
      <div class="feed-card-header">
        <div class="feed-avatar"></div>
        <div class="feed-author">
          <span class="feed-name">--</span>
          <span class="feed-time">--</span>
        </div>
      </div>
      <div class="feed-card-body">
        <div class="feed-text">—— 动态内容待同步 ——</div>
        <div class="feed-images" data-status="stub">
          <div class="feed-image-placeholder"></div>
          <div class="feed-image-placeholder"></div>
          <div class="feed-image-placeholder"></div>
        </div>
      </div>
      <div class="feed-card-actions" data-status="stub">
        <span class="feed-action">❤️ 0</span>
        <span class="feed-action">💬 0</span>
        <span class="feed-action">↗️ 转发</span>
      </div>
    </div>

    <!-- 动态卡片 2 -->
    <div class="feed-card" data-status="stub">
      <div class="feed-card-header">
        <div class="feed-avatar"></div>
        <div class="feed-author">
          <span class="feed-name">--</span>
          <span class="feed-time">--</span>
        </div>
      </div>
      <div class="feed-card-body">
        <div class="feed-text">—— 动态内容待同步 ——</div>
      </div>
      <div class="feed-card-actions" data-status="stub">
        <span class="feed-action">❤️ 0</span>
        <span class="feed-action">💬 0</span>
        <span class="feed-action">↗️ 转发</span>
      </div>
    </div>

    <!-- AI 引用对话卡片 -->
    <div class="feed-card feed-card-ai" data-status="stub">
      <div class="feed-card-header">
        <div class="ai-badge">🤖 AI 对话</div>
      </div>
      <div class="feed-card-body">
        <div class="feed-text">—— AI 引用对话内容待同步 ——</div>
      </div>
      <div class="feed-card-actions" data-status="stub">
        <span class="feed-action">❤️ 0</span>
        <span class="feed-action">💬 0</span>
        <span class="feed-action">↗️ 转发</span>
      </div>
    </div>

  </main>

</div>
<script src="js/world-feed.js"></script>
</body>
</html>
