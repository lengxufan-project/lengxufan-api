<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>观察者之窗</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/observer-panel.css">
</head>
<body>
  <div class="observer-panel">

    <!-- 顶部：返回 + 标题 -->
    <header class="op-header">
      <a class="back-btn" href="index.html?skipIntro=1" onclick="event.preventDefault();goBack()">← 返回</a>
      <h1 class="op-title">观察者之窗</h1>
      <span class="op-sub">OBSERVER</span>
    </header>

    <main class="op-body">

      <!-- 中央：玻璃圆环仪表盘（情绪值） -->
      <section class="ring-stage">
        <div class="observer-ring" id="observerRing" style="--p: 0;">
          <div class="halo"></div>
          <button class="core" id="breathCore" title="点击深呼吸，重置状态" aria-label="深呼吸重置"></button>
          <div class="value-wrap">
            <div class="value" id="emotionValue">0</div>
            <div class="value-label">情绪值</div>
          </div>
        </div>
      </section>

      <!-- 下方：压力值进度条 -->
      <section class="stress-block">
        <div class="stress-head">
          <span class="stress-title">压力值</span>
          <span class="stress-num" id="stressNum">0 / 100</span>
        </div>
        <div class="stress-bar">
          <div class="stress-fill" id="stressFill"></div>
        </div>
      </section>

      <!-- 下方：亲密度摘要 -->
      <section class="relation-summary" id="relationSummary">
        <div class="rel-title">亲密度</div>
        <!-- 三行由 js/observer-panel.js 注入 -->
      </section>

    </main>

    <!-- 底部：状态说明文字 -->
    <footer class="op-footer">
      <p class="breath-hint" id="breathHint">
        此处展示世界对你状态的观测：情绪、压力与各角色亲密度。点击中央发光点进行一次深呼吸——数值暂时归零、光晕扩散，2 秒后恢复观测。
      </p>
    </footer>

  </div>

  <script src="js/observer-panel.js"></script>
</body>
</html>
