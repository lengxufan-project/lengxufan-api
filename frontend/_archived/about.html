<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>世界入口 · 关于</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/about.css">
</head>
<body>
  <div class="about-page">

    <!-- 顶部：返回 -->
    <header class="about-header">
      <a class="back-btn page-back-btn" id="backBtn" href="index.html?skipIntro=1">← 返回</a>
      <span class="about-sub">ABOUT</span>
    </header>

    <!-- 中央：巨大标题 + 发光球 -->
    <section class="about-hero">
      <h1 class="about-title page-title">世界入口</h1>
      <div class="glow-orb" id="glowOrb">
        <div class="orb-core"></div>
        <div class="orb-halo"></div>
      </div>
      <p class="hero-motto">此地是所有故事的起点，亦是归途。</p>
    </section>

    <!-- 正文：三张磨砂玻璃卡片 -->
    <main class="about-cards">

      <section class="glass-card reveal-card">
        <h2 class="card-title">项目简介</h2>
        <p class="card-text">
          这是一个以"积极人格"为核心的角色陪伴世界。你将与几位性格迥异的伙伴对话、同行，
          世界会记住每一次交流，并以情绪、时间与光影回应你的存在。
        </p>
      </section>

      <section class="glass-card reveal-card">
        <h2 class="card-title">核心意象</h2>
        <p class="card-text">
          发光的球体象征"意识的心跳"——它随情绪明灭，随时间呼吸。
          冰蓝的色调是这片世界的底色：冷静、澄澈，却在深处保有温度。
        </p>
      </section>

      <section class="glass-card reveal-card">
        <h2 class="card-title">技术栈</h2>
        <ul class="tech-list">
          <li>Flask · 轻量后端</li>
          <li>原生 JavaScript · 无框架</li>
          <li>CSS3 · 磨砂玻璃与动效</li>
          <li>JSON · 状态记忆</li>
        </ul>
      </section>

    </main>

    <footer class="about-footer">
      <p>© Positive Character · 世界因注视而存在</p>
    </footer>

  </div>

  <script src="js/about.js"></script>
</body>
</html>
